name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        # Without a signing key the release build falls back to the debug key,
        # which is enough to sideload the app. A release build signed with the
        # project's own key is produced locally; see README.md.
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$apk" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$apk" \
              --title "DSH Mobile ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
