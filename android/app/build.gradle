plugins {
	id 'com.android.application'
}

android {
	namespace 'dev.tatudrag0n.dshmobile'
	compileSdk 35

	defaultConfig {
		applicationId 'dev.tatudrag0n.dshmobile'
		minSdk 24
		targetSdk 35
		versionCode 7
		versionName '1.2.0'
		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
	}

	signingConfigs {
		release {
			storeFile rootProject.file(System.getenv('DSH_MOBILE_KEYSTORE') ?: 'dsh-mobile.keystore')
			storePassword System.getenv('DSH_MOBILE_KEYSTORE_PASSWORD')
			keyAlias System.getenv('DSH_MOBILE_KEY_ALIAS')
			keyPassword System.getenv('DSH_MOBILE_KEY_PASSWORD')
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			signingConfig signingConfigs.release
		}
		debug {
			applicationIdSuffix '.debug'
			versionNameSuffix '-debug'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	// The executables that make up the on-device Host (node and bash) are
	// packaged as `lib*.so` because Android only runs binaries from the native
	// library directory; leaving them compressed would keep them inside the APK
	// where nothing can exec them.
	packagingOptions {
		jniLibs {
			useLegacyPackaging = true
		}
	}

	// The app has no dependencies on purpose: it is a WebView, and every
	// library would only add weight to a download the phone fetches once.
	lint {
		abortOnError true
	}
}

// Validate only release tasks, so debug builds and tests need no signing secrets.
def checkReleaseSigning = tasks.register('checkReleaseSigning') {
	doLast {
		def config = android.signingConfigs.release
		if (!config.storeFile.isFile() || !config.storePassword || !config.keyAlias || !config.keyPassword) {
			throw new GradleException('Release signing is required. Set DSH_MOBILE_KEYSTORE, DSH_MOBILE_KEYSTORE_PASSWORD, DSH_MOBILE_KEY_ALIAS and DSH_MOBILE_KEY_PASSWORD; use assembleDebug for local testing.')
		}
	}
}
tasks.configureEach { task ->
	if (task.name == 'preReleaseBuild' || task.name == 'validateSigningRelease') {
		task.dependsOn(checkReleaseSigning)
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test:runner:1.6.2'
	androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
